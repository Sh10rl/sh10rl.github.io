name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Post dates come from git history, so the build needs all of it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Optimized images are cached between runs; only new or changed ones get re-encoded.
      # Just the images: the content store beside them keeps Markdown as rendered by the
      # previous build, so changes to the Markdown pipeline would not show up.
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: astro-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
